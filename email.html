// Populate starred
emails.starred = emails.inbox.filter(e => e.starred);

let currentFolder = 'inbox';
let currentEmailId = null;
let selectedEmails = new Set();

// Render folder list
function renderFolders() {
  document.querySelectorAll('.folder-item').forEach(item => {
    item.onclick = () => {
      document.querySelectorAll('.folder-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      currentFolder = item.dataset.folder;
      currentEmailId = null;
      selectedEmails.clear();
      renderEmailList();
      document.getElementById('no-selection').style.display = 'flex';
      document.getElementById('no-selection').nextElementSibling?.remove();
    };
  });
}

// Render email list
function renderEmailList() {
  const list = document.getElementById('email-list');
  const folderEmails = emails[currentFolder] || [];
  const unreadCount = folderEmails.filter(e => e.unread).length;
  const countEl = document.getElementById('inbox-count');
  if (currentFolder === 'inbox') countEl.textContent = unreadCount || '';
  if (!countEl.textContent) countEl.style.display = 'none';

  list.innerHTML = folderEmails.map(email => `
    <div class="email-item ${email.unread ? 'unread' : ''} ${selectedEmails.has(email.id) ? 'selected' : ''}" data-id="${email.id}">
      <input type="checkbox" class="checkbox" ${selectedEmails.has(email.id) ? 'checked' : ''} onchange="toggleSelect(${email.id}, event)">
      <span class="star ${email.starred ? 'starred' : ''}" onclick="toggleStar(${email.id}, event)">${email.starred ? '★' : '☆'}</span>
      <span class="important-tag ${email.important ? 'marked' : ''}" onclick="toggleImportant(${email.id}, event)">${email.important ? '🚩' : '⚐'}</span>
      <div class="email-info" onclick="openEmail(${email.id})">
        <div class="sender-row">
          <span class="sender">${email.from}</span>
          <span class="time">${email.date}</span>
        </div>
        <div class="subject">${email.subject}</div>
        <div class="preview">${email.preview}</div>
      </div>
    </div>
  `).join('');

  if (folderEmails.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);">此文件夹为空</div>';
  }
}

// Open email
function openEmail(id) {
  const email = emails[currentFolder].find(e => e.id === id);
  if (!email) return;
  currentEmailId = id;
  if (email.unread) {
    email.unread = false;
    renderEmailList();
  }
  const panel = document.getElementById('email-content-panel');
  const avatarColors = ['#1a73e8','#d93025','#f9ab00','#1e8e3e','#8e24aa'];
  const color = avatarColors[id % avatarColors.length];
  panel.innerHTML = `
    <div class="email-view">
      <div class="email-detail-header">
        <div class="detail-subject">${email.subject}</div>
        <div class="detail-meta">
          <div class="detail-avatar" style="background:${color}">${email.from[0]}</div>
          <div class="detail-meta-info">
            <div class="detail-sender">${email.from} <span class="sender-email">&lt;${email.email}&gt;</span></div>
            <div class="detail-recipients">收件人: memory_00@oldmail.com</div>
          </div>
          <div class="detail-time">${email.date} ${email.time}</div>
          <div class="detail-actions">
            <button title="回复">↩️</button>
            <button title="转发">↪️</button>
            <button title="删除" onclick="deleteEmail(${id})">🗑️</button>
          </div>
        </div>
      </div>
      <div class="email-body">${email.body}</div>
    </div>`;
  panel.querySelector('.email-view').addEventListener('scroll', (e) => {
    document.getElementById('email-back-top').classList.toggle('show', e.target.scrollTop > 200);
  });
}

// Toggle star
function toggleStar(id, e) {
  e.stopPropagation();
  const email = emails[currentFolder].find(em => em.id === id);
  if (email) {
    email.starred = !email.starred;
    emails.starred = emails.inbox.filter(em => em.starred);
    renderEmailList();
  }
}

// Toggle important
function toggleImportant(id, e) {
  e.stopPropagation();
  const email = emails[currentFolder].find(em => em.id === id);
  if (email) {
    email.important = !email.important;
    renderEmailList();
  }
}

// Delete email
function deleteEmail(id) {
  const idx = emails[currentFolder].findIndex(e => e.id === id);
  if (idx > -1) {
    const [email] = emails[currentFolder].splice(idx, 1);
    if (currentFolder !== 'trash') {
      emails.trash.push(email);
    }
    renderEmailList();
    document.getElementById('email-content-panel').innerHTML = `
      <div class="no-selection"><div class="big-icon">📧</div><div>邮件已删除</div></div>`;
  }
}

// Select emails
function toggleSelect(id, e) {
  e.stopPropagation();
  if (selectedEmails.has(id)) selectedEmails.delete(id);
  else selectedEmails.add(id);
}
function toggleSelectAll() {
  const checked = document.getElementById('select-all').checked;
  emails[currentFolder].forEach(e => {
    if (checked) selectedEmails.add(e.id);
    else selectedEmails.delete(e.id);
  });
  renderEmailList();
}
function applyBulkAction() {
  const action = document.getElementById('bulk-action').value;
  selectedEmails.forEach(id => {
    const email = emails[currentFolder].find(e => e.id === id);
    if (!email) return;
    if (action === 'read') email.unread = false;
    if (action === 'unread') email.unread = true;
    if (action === 'star') email.starred = true;
    if (action === 'delete') deleteEmail(id);
  });
  selectedEmails.clear();
  document.getElementById('select-all').checked = false;
  renderEmailList();
}

    date: '2026-08-23', time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
    unread:false, starred:false, important:false, body:'<p>'+body+'</p>'
  });
  closeCompose();
  alert('邮件已发送！');
  document.getElementById('compose-to').value = '';
  document.getElementById('compose-subject').value = '';
  document.getElementById('compose-body').value = '';
}

// Search
document.getElementById('email-search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  if (!q) { renderEmailList(); return; }
  const list = document.getElementById('email-list');
  const all = [...emails.inbox, ...emails.sent, ...emails.draft];
  const results = all.filter(e =>
    e.subject.toLowerCase().includes(q) ||
    e.from.toLowerCase().includes(q) ||
    e.preview.toLowerCase().includes(q)
  );
  list.innerHTML = results.map(email => `
    <div class="email-item ${email.unread ? 'unread' : ''}" data-id="${email.id}">
