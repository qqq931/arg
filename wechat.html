<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威信 - memory_00 的聊天记录</title>
<link rel="stylesheet" href="assets/css/wechat.css">
</head>
<body data-page="wechat">

<div class="wx-window" id="wx-window">
  <!-- Left icon bar -->
  <div class="wx-iconbar">
    <div class="avatar">夏
      <div class="unread-dot" id="avatar-unread" style="display:none;"></div>
    </div>
    <div class="icon-btn active" title="聊天">💬</div>
    <div class="icon-btn" title="通讯录">👥</div>
    <div class="icon-btn" title="收藏">⭐</div>
    <div class="bottom">
      <div class="minimize-btn" onclick="minimizeWindow()" title="最小化">—</div>
      <div class="maximize-btn" onclick="toggleMaximize()" title="最大化">⛶</div>
    </div>
  </div>

  <!-- Chat list -->
  <div class="wx-sidebar">
    <div class="search-bar">
      <input type="text" id="wx-search" placeholder="🔍 搜索" oninput="searchChats(this.value)">
    </div>
    <div class="chat-list" id="chat-list">
      <!-- Chats injected by JS -->
    </div>
  </div>

  <!-- Main chat area -->
  <div class="wx-main" id="wx-main">
    <div class="chat-header">
      <div class="chat-title" id="chat-title">文件传输助手</div>
      <div class="chat-actions">
        <button title="切换背景" onclick="toggleDarkBg()">🌙</button>
        <button title="更多">⋯</button>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="typing-indicator" id="typing-indicator">
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span id="typing-text">对方正在输入...</span>
    </div>
    <div class="chat-input-area" style="position:relative;">
      <div class="input-toolbar">
        <button class="emoji-toggle" onclick="toggleEmojiPanel()" title="表情">😊</button>
        <button class="voice-btn" onclick="toggleVoice()" title="语音">🎤</button>
        <button title="文件">📎</button>
        <button title="截图">✂️</button>
      </div>
      <div class="emoji-panel" id="emoji-panel"></div>
      <textarea id="msg-input" placeholder="输入消息..." rows="3" onkeydown="handleMsgKey(event)"></textarea>
      <div class="input-footer">
        <span class="hint" id="input-hint">按 Enter 发送</span>
        <button class="send-btn" onclick="sendMessage()">发送(S)</button>
      </div>
    </div>
  </div>
</div>

<!-- Voice recording overlay -->
<div class="voice-overlay" id="voice-overlay">
  <div class="mic-icon">🎤</div>
  <div>正在录音...</div>
  <div class="voice-wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div style="font-size:11px;color:#999;">松开发送 · 取消发送</div>
</div>

<!-- Special notification -->
<div class="special-notification" id="special-notif">
  <div class="notif-avatar">?</div>
  <div class="notif-text">
    <div class="sender" id="notif-sender">未知联系人</div>
    <div id="notif-msg">我一直都在</div>
  </div>
</div>

<!-- Fireworks canvas -->
<canvas id="fireworks-canvas"></canvas>

<script src="assets/js/common.js"></script>

let currentChat = 'filehelper';
let unreadChats = { unknown: 1, recycle: 1 };

// Render chat list
function renderChatList(filter = '') {
  const list = document.getElementById('chat-list');
  const order = ['filehelper','family','recycle','laoli','subscription','unknown'];
  list.innerHTML = order
    .filter(id => !filter || chats[id].name.includes(filter))
    .map(id => {
      const c = chats[id];
      const lastMsg = c.messages[c.messages.length - 1];
      let preview = '';
      if (lastMsg) {
        if (lastMsg.date) preview = lastMsg.date;
        else if (lastMsg.system) preview = lastMsg.text;
        else if (lastMsg.isArticle) preview = '[文章] ' + lastMsg.text;
        else if (lastMsg.self) preview = '我: ' + lastMsg.text;
        else preview = (lastMsg.from || '未知') + ': ' + lastMsg.text;
      }
      const unread = unreadChats[id] || 0;
      return `
      <div class="chat-item ${c.type} ${id === currentChat ? 'active' : ''}" onclick="switchChat('${id}')">
        <div class="item-avatar ${c.avatarClass}">
          ${c.icon}
          ${unread ? `<div class="unread-dot">${unread > 99 ? '99+' : unread}</div>` : ''}
        </div>
        <div class="item-info">
          <div class="item-top">
            <span class="item-name">${c.name}</span>
            <span class="item-time">${lastMsg && lastMsg.time ? lastMsg.time.slice(5) : ''}</span>
          </div>
          <div class="item-preview">${preview}</div>
        </div>
      </div>`;
    }).join('');
}

// Switch chat
function switchChat(id) {
  currentChat = id;
  if (unreadChats[id]) {
    delete unreadChats[id];
  }
  renderChatList(document.getElementById('wx-search').value);
  renderMessages();
  document.getElementById('chat-title').innerHTML = chats[id].name +
    (chats[id].members ? `<span class="members">(${chats[id].members})</span>` : '');
  document.getElementById('msg-input').focus();
}

// Render messages
function renderMessages() {
  const chat = chats[currentChat];
  const container = document.getElementById('chat-messages');

  if (chat.isArticle) {
    container.innerHTML = `
      <button class="back-to-chat" onclick="chat.isArticle=false;renderMessages();">← 返回聊天</button>
      <div class="subscription-article">
        <h1>${articleContent.title}</h1>
        <div class="article-meta">${articleContent.author}</div>
        <div class="article-body">${articleContent.body}</div>
      </div>`;
    return;
  }

  container.innerHTML = chat.messages.map((msg, idx) => {
    if (msg.date) {
      return `<div class="msg-date"><span>${msg.date}</span></div>`;
    }
    if (msg.system) {
      return `<div class="sys-msg"><span>${msg.text}</span></div>`;
    }
    if (msg.isArticle) {
      return `
        <div class="message" style="cursor:pointer;" onclick="showArticle()">
          <div class="msg-avatar ${msg.avatarColor}">${msg.avatar}</div>
          <div class="msg-content">
            <div class="msg-sender">${msg.from}</div>
            <div class="msg-bubble">📄 ${msg.text}<br><small style="color:var(--text-dim);">点击查看</small></div>
            <div class="msg-time">${msg.time}</div>
          </div>
        </div>`;
    }
    const isSelf = msg.self || msg.from === '我' || (currentChat === 'filehelper' && msg.from === 'self');
    return `
      <div class="message ${isSelf ? 'self' : ''}">
        <div class="msg-avatar ${msg.avatarColor || (isSelf ? 'avatar-green' : 'avatar-blue')}">${msg.avatar || (isSelf ? '我' : msg.from[0])}</div>
        <div class="msg-content">
          ${!isSelf && chat.type === 'group' ? `<div class="msg-sender">${msg.from}</div>` : ''}
          <div class="msg-bubble">
            ${msg.text}
            ${isSelf && msg.status ? `<span class="msg-status ${msg.status}"></span>` : ''}
            <div class="msg-actions">
              <button onclick="copyMsg(${idx})">复制</button>
              <button onclick="deleteMsg(${idx})">删除</button>
            </div>
          </div>
          <div class="msg-time">${msg.time}</div>
        </div>
      </div>`;
  }).join('');

  container.scrollTop = container.scrollHeight;
}

function showArticle() {
  const container = document.getElementById('chat-messages');
  container.innerHTML = `
    <button class="back-to-chat" onclick="switchChat('${currentChat}')">← 返回聊天</button>
    <div class="subscription-article">
      <h1>${articleContent.title}</h1>
      <div class="article-meta">${articleContent.author}</div>
      <div class="article-body">${articleContent.body}</div>
    </div>`;
}

// Send message
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const chat = chats[currentChat];
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const timeStr = `2026-08-23 ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const msg = { from:'我', text, time:timeStr, self:true, status:'sending', avatar:'夏', avatarColor:'avatar-green' };
  chat.messages.push(msg);
  renderMessages();

  // Simulate send status
  setTimeout(() => {
    msg.status = 'sent';
    renderMessages();
  }, 500);
  setTimeout(() => {
    msg.status = 'read';
    renderMessages();
  }, 1200);

  // Check for special triggers
  checkSpecialTriggers(text);
}

function handleMsgKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// Special triggers
function checkSpecialTriggers(text) {
  const lower = text.toLowerCase();

  // "爸爸" or "dad" -> unknown contact replies
  if (text.includes('爸爸') || lower.includes('dad')) {
    showTyping('未知联系人');
    setTimeout(() => {
      hideTyping();
      chats.unknown.messages.push({
        from:'未知联系人', text:'嗯，爸爸在。',
        time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
        avatar:'?', avatarColor:'avatar-gray'
      });
      unreadChats.unknown = (unreadChats.unknown || 0) + 1;
      renderChatList(document.getElementById('wx-search').value);
      if (currentChat === 'unknown') renderMessages();
      showNotification('未知联系人', '嗯，爸爸在。');
    }, 1500);
  }

  // "TYGDWX" in filehelper
  if (currentChat === 'filehelper' && text.toUpperCase() === 'TYGDWX') {
    setTimeout(() => {
      const chat = chats[currentChat];
      chat.messages.push({
        from:'self', text:'✅ 密码验证通过。前往加密存档 →', time:new Date().toLocaleTimeString(),
        self:true, avatar:'夏', avatarColor:'avatar-green'
      });
      renderMessages();
    }, 800);
  }

  // "邮箱" in recycle
  if (currentChat === 'recycle' && text.includes('邮箱')) {
    setTimeout(() => {
      const chat = chats[currentChat];
      chat.messages.push({
        from:'空白头像', text:'安全邮箱 → email.html', time:new Date().toLocaleTimeString(),
        avatar:' ', avatarColor:'avatar-dark'
      });
      renderMessages();
    }, 1000);
  }

  // "生日快乐" -> fireworks
  if (text.includes('生日快乐') || text.includes('生日')) {
    setTimeout(triggerFireworks, 500);
  }

  // Unknown contact auto-reply
  if (currentChat === 'unknown' && !text.includes('爸爸')) {
    showTyping('未知联系人');
    setTimeout(() => {
      hideTyping();
      chats.unknown.messages.push({
        from:'未知联系人', text:'我一直都在。',
        time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
        avatar:'?', avatarColor:'avatar-gray'
      });
      if (currentChat === 'unknown') renderMessages();
      else {
        unreadChats.unknown = (unreadChats.unknown || 0) + 1;
        renderChatList(document.getElementById('wx-search').value);
      }
    }, 1200);
  }
}

// Typing indicator
function showTyping(name) {
  document.getElementById('typing-text').textContent = name + '正在输入...';
  document.getElementById('typing-indicator').classList.add('show');
}
function hideTyping() {
  document.getElementById('typing-indicator').classList.remove('show');
}

// Notification
function showNotification(sender, msg) {
  const notif = document.getElementById('special-notif');
  document.getElementById('notif-sender').textContent = sender;
  document.getElementById('notif-msg').textContent = msg;
  notif.classList.add('show');
  setTimeout(() => notif.classList.remove('show'), 4000);
}

// Emoji panel
function renderEmojiPanel() {
  const emojis = ['😀','😂','🥰','😎','🤔','😭','😡','👍','👏','❤️','🎉','🔥','💯','📡','🌟','🙏','💪','🤝','😊','😢','😮','😴','🥺','😇'];
  document.getElementById('emoji-panel').innerHTML = emojis.map(e =>
    `<span onclick="insertEmoji('${e}')">${e}</span>`
  ).join('');
}
function toggleEmojiPanel() {
  document.getElementById('emoji-panel').classList.toggle('show');
}
function insertEmoji(e) {
  const input = document.getElementById('msg-input');
  input.value += e;
  input.focus();
}

// Voice recording
let recording = false;
function toggleVoice() {
  recording = !recording;
  const overlay = document.getElementById('voice-overlay');
  if (recording) {
    overlay.classList.add('show');
    setTimeout(() => {
      if (recording) {
        recording = false;
        overlay.classList.remove('show');
      }
    }, 3000);
  } else {
    overlay.classList.remove('show');
  }
}

// Dark background
function toggleDarkBg() {
  document.getElementById('wx-main').classList.toggle('dark-bg');
}

// Search
function searchChats(q) {
  renderChatList(q);
}

// Copy/delete messages
function copyMsg(idx) {
  const msg = chats[currentChat].messages[idx];
  if (msg && msg.text) {
    navigator.clipboard.writeText(msg.text).catch(()=>{});
  }
}
function deleteMsg(idx) {
  if (confirm('确定删除这条消息吗？')) {
    chats[currentChat].messages.splice(idx, 1);
    renderMessages();
  }
}

// Window controls
function minimizeWindow() {
  document.getElementById('wx-window').classList.toggle('minimized');
}
function toggleMaximize() {
  const win = document.getElementById('wx-window');
  if (win.style.position === 'fixed') {
    win.style = '';
  } else {
    win.style.cssText = 'position:fixed;inset:0;z-index:200;';
  }
}

// Fireworks
function triggerFireworks() {
  const canvas = document.getElementById('fireworks-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const particles = [];
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9ff3','#07c160'];

  for (let i = 0; i < 80; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 100 + Math.random() * 50
    });
  }
  // Confetti
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: -20,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 200,
      gravity: 0.05,
      confetti: true
    });
  }

  let frame;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.gravity) p.vy += p.gravity;
      p.life--;
      ctx.globalAlpha = p.life / 150;
      ctx.fillStyle = p.color;
      if (p.confetti) {
        ctx.fillRect(p.x, p.y, 8, 8);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
    if (particles.some(p => p.life > 0)) {
      frame = requestAnimationFrame(animate);
    } else {
      cancelAnimationFrame(frame);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  animate();
}
