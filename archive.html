// ========== Shell ==========
function showPrompt() {
  // Remove existing input line
  const existingPrompt = termBody.querySelector('.prompt-line.active-prompt');
  if (existingPrompt) existingPrompt.remove();

  const line = document.createElement('div');
  line.className = 'prompt-line active-prompt';
  line.innerHTML = `
    <span class="prompt-symbol">❯</span>
    <span class="prompt-path">~/archive</span>
    <input type="text" class="prompt-input" id="prompt-input" autofocus autocomplete="off" spellcheck="false">
  `;
  termBody.appendChild(line);
  const input = document.getElementById('prompt-input');
  input.focus();
  input.addEventListener('keydown', handleCommand);
  termBody.scrollTop = termBody.scrollHeight;

  // Click anywhere to focus
  termBody.onclick = () => input.focus();
}

function handleCommand(e) {
  const input = e.target;
  if (e.key === 'Enter') {
    const cmd = input.value.trim();
    if (!cmd) return;
    commandHistory.push(cmd);
    historyIndex = commandHistory.length;
    processCommand(cmd);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = commandHistory[historyIndex] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      input.value = commandHistory[historyIndex] || '';
    } else {
      historyIndex = commandHistory.length;
      input.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const partial = input.value;
    const fileNames = Object.keys(files);
    const commands = ['help','ls','cat','whoami','signal','dad','爸爸','birthday','clear','date','echo','history','cd'];
    const all = [...commands, ...fileNames];
    const match = all.find(c => c.startsWith(partial));
    if (match) input.value = match;
  }
}

function processCommand(cmd) {
  const parts = cmd.split(/\s+/);
  const command = parts[0].toLowerCase();
  const args = parts.slice(1);

  // Replace active prompt with static line
  const input = document.getElementById('prompt-input');
  const promptLine = input.closest('.prompt-line');
  promptLine.innerHTML = `
    <span class="prompt-symbol">❯</span>
    <span class="prompt-path">~/archive</span>
    <span>${cmd}</span>
  `;
  promptLine.classList.remove('active-prompt');

  let output = '';
  switch (command) {
    case 'help':
      output = `<div class="output-line amber">可用命令：</div>
<table class="help-table">
<tr><td class="cmd">ls</td><td class="desc">列出文件</td></tr>
<tr><td class="cmd">cat &lt;文件名&gt;</td><td class="desc">查看文件内容</td></tr>
<tr><td class="cmd">whoami</td><td class="desc">查看当前用户</td></tr>
<tr><td class="cmd">signal</td><td class="desc">检查信号强度</td></tr>
<tr><td class="cmd">dad / 爸爸</td><td class="desc">呼叫爸爸</td></tr>
<tr><td class="cmd">birthday</td><td class="desc">生日快乐</td></tr>
<tr><td class="cmd">clear</td><td class="desc">清屏</td></tr>
<tr><td class="cmd">date</td><td class="desc">显示日期</td></tr>
<tr><td class="cmd">echo &lt;text&gt;</td><td class="desc">回显文字</td></tr>
<tr><td class="cmd">history</td><td class="desc">命令历史</td></tr>
<tr><td class="cmd">cd &lt;dir&gt;</td><td class="desc">切换目录</td></tr>
</table>`;
      break;

    case 'ls':
      output = '<div class="file-list">';
      Object.entries(files).forEach(([name, f]) => {
        const viewed = viewedFiles.has(name);
        output += `<div class="file-item" onclick="viewFile('${name}')">
          <span class="file-icon">${viewed ? '📄' : '📁'}</span>
          <span class="file-name">${name}</span>
          <span class="file-size">${f.size}</span>
          <span class="file-status">${viewed ? '✓ 已读' : '未读'}</span>
        </div>`;
      });
      output += '</div>';
      output += '<div class="output-line dim" style="margin-top:8px;">点击文件名查看内容 · 共5个文件</div>';
      break;

    case 'cat':
      if (args.length === 0) {
        output = '<div class="output-line error">用法: cat &lt;文件名&gt;</div>';
      } else {
        const fileName = args[0];
        if (files[fileName]) {
          showFileContent(fileName);
          return;
        } else {
          output = `<div class="output-line error">cat: ${fileName}: 文件不存在</div>`;
          output += '<div class="output-line dim">可用文件：' + Object.keys(files).join(', ') + '</div>';
        }
      }
      break;

    case 'whoami':
      output = '<div class="output-line green">你是夏晚，夏建国的女儿。</div>';
      output += '<div class="output-line dim">memory_00 的唯一继承人。</div>';
      break;

    case 'signal':
      showSignalAnimation();
      return;

    case 'dad':
    case '爸爸':
      typeDadReply();
      return;

    case 'birthday':
      document.getElementById('birthday-overlay').classList.add('show');
      return;

    case 'clear':
      termBody.innerHTML = '';
      showPrompt();
      return;

    case 'date':
      output = '<div class="output-line">2026年8月23日 · 星期日 · 小夏25岁生日</div>';
      break;

    case 'echo':
      output = '<div class="output-line">' + args.join(' ') + '</div>';
      break;

    case 'history':
      output = commandHistory.map((c, i) =>
        `<div class="output-line dim">${i+1}  ${c}</div>`
      ).join('');
      break;

    case 'cd':
      output = '<div class="output-line dim">当前目录: ~/archive （没有其他目录了）</div>';
      break;

    default:
      output = `<div class="output-line error">命令未找到: ${command}</div>`;
      output += '<div class="output-line dim">输入 "help" 查看可用命令</div>';
  }

  if (output) {
    const outEl = document.createElement('div');
    outEl.innerHTML = output;
    termBody.appendChild(outEl);
  }
  termBody.scrollTop = termBody.scrollHeight;
  showPrompt();
}

// View file
function viewFile(fileName) {
  // Remove active prompt
  const activePrompt = termBody.querySelector('.active-prompt');
  if (activePrompt) activePrompt.remove();
  showFileContent(fileName);
}

function showFileContent(fileName) {
  const file = files[fileName];
  if (!file) return;
  viewedFiles.add(fileName);

  const viewer = document.createElement('div');
  viewer.className = 'file-viewer';
  viewer.innerHTML = `
    <div class="file-header">📄 ${fileName} <span style="color:var(--term-dim);font-size:12px;">(${file.size})</span></div>
    <div class="file-content-text" id="file-text"></div>
    <div class="file-back" onclick="closeFile()">← 返回 (输入 ls 查看文件列表)</div>
  `;
  termBody.appendChild(viewer);
  termBody.scrollTop = termBody.scrollHeight;

  // Typewriter effect for content
  const textEl = document.getElementById('file-text');
  const content = file.content;
  let i = 0;
  // Strip HTML for typing, then render
  const temp = document.createElement('div');
  temp.innerHTML = content;
  const plainText = temp.textContent;

  function typeChar() {
    if (i < plainText.length) {
      textEl.textContent = plainText.slice(0, i + 1);
      i++;
      termBody.scrollTop = termBody.scrollHeight;
      setTimeout(typeChar, 15);
    } else {
      textEl.innerHTML = content;
      termBody.scrollTop = termBody.scrollHeight;
      // Check if all files viewed
      if (viewedFiles.size === Object.keys(files).length) {
        setTimeout(showFinalSequence, 1500);
      } else {
        showPrompt();
      }
    }
  }
  typeChar();
}

function closeFile() {
  const viewer = termBody.querySelector('.file-viewer');
  if (viewer) viewer.remove();
  showPrompt();
}

  anim.innerHTML = `
    <div class="output-line amber" style="text-align:center;">正在检测信号...</div>
    <div class="signal-bars" id="sig-bars">
      <div class="bar" style="height:15px;"></div>
      <div class="bar" style="height:25px;"></div>
      <div class="bar" style="height:35px;"></div>
      <div class="bar" style="height:45px;"></div>
      <div class="bar" style="height:60px;"></div>
    </div>
    <div class="signal-label" id="sig-label">连接中...</div>
  `;
  termBody.appendChild(anim);
  termBody.scrollTop = termBody.scrollHeight;

  const bars = anim.querySelectorAll('.bar');
  let i = 0;
  const interval = setInterval(() => {
    if (i < bars.length) {
      bars[i].classList.add('active');
      i++;
    } else {
      clearInterval(interval);
      document.getElementById('sig-label').textContent = '▓▓▓▓▓ 信号满格';
      setTimeout(() => {
        showPrompt();
      }, 800);
    }
  }, 400);
}

// Dad reply
function typeDadReply() {
  const reply = document.createElement('div');
  reply.className = 'output-line green';
  reply.style.margin = '8px 0';
  termBody.appendChild(reply);

  const text = '嗯，爸爸在。';
  let i = 0;
  function type() {
    if (i <= text.length) {
      reply.textContent = text.slice(0, i);
      i++;
      termBody.scrollTop = termBody.scrollHeight;
      setTimeout(type, 150);
    } else {
      showPrompt();
    }
  }
  type();
}

// Final sequence
function showFinalSequence() {
  currentView = 'final';
  const finalEl = document.createElement('div');
  finalEl.className = 'final-sequence';
  finalEl.innerHTML = `
    <div class="final-signal">📡</div>
    <div class="signal-full">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="final-text" id="final-text"></div>
    <div class="final-sub" id="final-sub"></div>
    <button class="reconnect-btn" onclick="location.reload()">重新连接</button>
  `;
  termBody.appendChild(finalEl);
  termBody.scrollTop = termBody.scrollHeight;

  const finalTexts = [
    { text: '所有文件已读取。', delay: 500 },
    { text: '正在断开连接...', delay: 1500 },
    { text: '连接已断开。', delay: 3000, cls: 'error' },
    { text: '', delay: 3500 },
    { text: '信号源：夏建国', delay: 4000 },
    { text: '状态：永远满格。', delay: 5000 },
  ];

  finalTexts.forEach(item => {
    setTimeout(() => {
      if (item.text) {
        const p = document.createElement('div');
        p.textContent = item.text;
        if (item.cls) p.className = item.cls;
        document.getElementById('final-text').appendChild(p);
        termBody.scrollTop = termBody.scrollHeight;
      }
    }, item.delay);
  });

  setTimeout(() => {
    document.getElementById('final-sub').textContent = '—— 小夏，爸爸为你骄傲 ——';
  }, 6000);
}

// Draggable terminal
const termWindow = document.getElementById('terminal-window');
const titlebar = document.getElementById('term-titlebar');
let isDragging = false, dragX = 0, dragY = 0;

titlebar.addEventListener('mousedown', (e) => {
  isDragging = true;
  const rect = termWindow.getBoundingClientRect();
  dragX = e.clientX - rect.left;
  dragY = e.clientY - rect.top;
  termWindow.classList.add('dragging');
  termWindow.style.position = 'fixed';
  termWindow.style.margin = '0';
  termWindow.style.left = rect.left + 'px';
  termWindow.style.top = rect.top + 'px';
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  termWindow.style.left = (e.clientX - dragX) + 'px';
  termWindow.style.top = (e.clientY - dragY) + 'px';
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  termWindow.classList.remove('dragging');
});

// Start
setTimeout(bootSequence, 500);
</script>
